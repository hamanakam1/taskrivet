[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskrivet"
version = "0.4.0"
description = "Keep agent work purposeful, context bounded, and failures visible."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Taskrivet contributors"}]
keywords = ["agents", "orchestration", "context", "cli", "coordination"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
taskrivet = "taskrivet.cli:main"

[project.urls]
Repository = "https://github.com/hamanakam1/taskrivet"
Issues = "https://github.com/hamanakam1/taskrivet/issues"

[tool.setuptools.packages.find]
include = ["taskrivet*"]
