name: container package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Build, smoke test, and publish CLI package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          VERSION=$(python -c 'import taskrivet; print(taskrivet.__version__)')
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker build -t "$IMAGE:$VERSION" .
          docker run --rm "$IMAGE:$VERSION" --help
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker logout ghcr.io
